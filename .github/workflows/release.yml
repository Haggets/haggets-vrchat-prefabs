name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  PKG: Packages/com.haggets.hvp

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read package info
        id: pkg
        run: |
          echo "name=$(jq -r .name "$PKG/package.json")" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r .version "$PKG/package.json")" >> "$GITHUB_OUTPUT"

      - name: Tag must match package.json version
        run: test "v${{ steps.pkg.outputs.version }}" = "${GITHUB_REF_NAME}"

      - name: Build zip
        run: (cd "$PKG" && zip -r "$GITHUB_WORKSPACE/${{ steps.pkg.outputs.name }}-${{ steps.pkg.outputs.version }}.zip" .)

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.pkg.outputs.name }}-${{ steps.pkg.outputs.version }}.zip
            ${{ env.PKG }}/package.json
